<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin | Cowartu</title>
<link rel="icon" href="assets/img/logo-mark.jpg"><link rel="stylesheet" href="assets/css/style.css">
<style>.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;margin-top:16px}table.a{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}table.a th,table.a td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left}table.a th{background:var(--soft);position:sticky;top:0}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}.bar input{flex:1;min-width:180px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}</style></head>
<body><main><section><div class="w">
<div class="panel" id="lg"><h2 style="font-size:1.5rem">Admin panel</h2><p class="lead" style="margin-bottom:14px">Enter your admin password to see admissions.</p><label class="fl" for="pw">Password</label><input id="pw" type="password" style="width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px"><div class="er" id="er"></div><div class="nv"><span></span><button class="btn p sm" id="go">Open</button></div></div>
<div id="ad" hidden><h2 style="font-size:1.6rem">Admissions <span id="ct" style="color:var(--mute);font-weight:500"></span></h2>
<div class="bar"><input id="q" type="search" placeholder="Search name, batch, email..."><button class="btn p sm" id="xl">Download Excel</button><button class="btn o sm" id="cv">Download CSV</button><button class="btn o sm" id="rf">Refresh</button></div>
<div class="tw"><table class="a" id="tb"></table></div></div>
</div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="assets/js/config.js"></script>
<script>
var H=[],R=[],$=function(i){return document.getElementById(i)};
function load(){$("er").textContent="";
 if(!CONFIG.SHEET_URL){$("er").textContent="SHEET_URL is empty in config.js";return}
 fetch(CONFIG.SHEET_URL+"?action=list&key="+encodeURIComponent($("pw").value)).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){$("er").textContent="Wrong password";return}
  H=d.head;R=d.rows;$("lg").hidden=true;$("ad").hidden=false;draw()}).catch(function(){$("er").textContent="Could not connect. Check SHEET_URL."})}
function rows(){var q=$("q").value.toLowerCase();return R.filter(function(r){return r.join(" ").toLowerCase().indexOf(q)>-1})}
function draw(){var v=rows(),t=$("tb");t.textContent="";var tr=t.insertRow();H.forEach(function(h){tr.appendChild(document.createElement("th")).textContent=h});
 v.forEach(function(r){var x=t.insertRow();r.forEach(function(c){x.insertCell().textContent=c})});$("ct").textContent="("+v.length+")"}
function data(){return [H].concat(rows())}
$("go").onclick=load;$("pw").onkeydown=function(e){if(e.key=="Enter")load()};$("rf").onclick=load;$("q").oninput=draw;
$("xl").onclick=function(){var w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(data()),"Admissions");XLSX.writeFile(w,"cowartu-admissions.xlsx")};
$("cv").onclick=function(){var s=data().map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="cowartu-admissions.csv";a.click()};
</script></body></html>
